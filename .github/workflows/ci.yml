name: ci

# Default merge-blocking gate. Runs on every push and pull request.
# Includes formatting, static analysis, the unit suite on Linux, a build,
# one limited Windows smoke job for platform-specific behavior Linux cannot
# prove (paths, config, identity), and runtime certification (3 OS × 4 Node
# versions, exact-head SHA binding, fail-closed aggregate verdict).
#
# Everything else heavy — the full three-OS matrix, race detector, cross
# compilation, lock conformance against real package managers, crash
# integration, soak, benchmarks, core/runner/platform certification, and
# govulncheck — lives in `full.yml` and runs on a schedule, on demand, or
# for a release. Those suites are not deleted, only moved off the blocking
# path.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: "0"
  GOTOOLCHAIN: local
  NODE_VERSION: "22"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          files="$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
          if [[ -n "$files" ]]; then
            echo "The following files need gofmt:" >&2
            echo "$files" >&2
            exit 1
          fi

      - name: Verify module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Load tool versions
        id: tools
        shell: bash
        run: |
          set -a
          source tools/versions.env
          set +a
          echo "golangci=${GOLANGCI_LINT_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ steps.tools.outputs.golangci }}

      - name: Verify production architecture
        run: go test ./internal/archcheck/... -count=1 -run TestProduction

      - name: Verify licenses and dependency allowlist
        run: |
          go run ./tools/check-license
          go run ./tools/check-deps
          go test ./tools/check-deps -count=1

      - name: Verify generated fixtures
        run: go run ./tools/conformance/verify-fixtures

      - name: Verify crash shard assignments
        run: go run ./tools/ci/verify-crash-shards

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      # -short skips the soak and wall-clock suites, which belong to the heavy
      # tier. This single run covers every package, including the config,
      # identity, install-preflight, and direct-change regression tests, so no
      # narrower `-run` pass is repeated afterwards.
      - name: Unit and integration tests
        run: go test ./... -short -count=1 -timeout 25m

      - name: Build binaries
        run: |
          go build -trimpath -o "${{ runner.temp }}/m" ./cmd/m
          go build -trimpath -o "${{ runner.temp }}/mx" ./cmd/mx

      - name: Doctor
        run: go run ./cmd/m --cwd fixtures/projects/mlock-greenfield doctor --json

  smoke:
    name: smoke
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # Limited on purpose: only the behavior that genuinely differs on
      # Windows and cannot be proven on Linux — path resolution and product
      # directory ownership, configuration layering, project identity, and CLI
      # bootstrap. The full Windows matrix stays in `full.yml`.
      - name: Configuration, identity, CLI, and path tests
        run: >-
          go test ./internal/config/... ./internal/project/... ./internal/cli/...
          ./internal/fsx/... -short -count=1 -timeout 20m

      - name: Build binaries
        run: |
          go build -trimpath -o "${{ runner.temp }}/m.exe" ./cmd/m
          go build -trimpath -o "${{ runner.temp }}/mx.exe" ./cmd/mx

      - name: Doctor
        run: go run ./cmd/m --cwd fixtures/projects/mlock-greenfield doctor --json

  runtime-cert:
    name: runtime certification
    uses: ./.github/workflows/runtime-cert.yml

  gate:
    name: gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - lint
      - test
      - smoke
      - runtime-cert
    steps:
      - name: Verify required jobs
        shell: bash
        run: |
          set -euo pipefail
          for result in \
            "${{ needs.lint.result }}" \
            "${{ needs.test.result }}" \
            "${{ needs.smoke.result }}" \
            "${{ needs.runtime-cert.result }}"
          do
            [[ "$result" == success ]] || exit 1
          done
