name: runtime-cert

# Reusable runtime certification workflow. Called from ci.yml (merge-blocking
# PR/push path) and full.yml (nightly/release heavy tier). Single source of
# truth for the runtime certification contract: 3 OS × 4 Node versions = 12
# required cells, exact-head SHA binding, fail-closed aggregate verdict.

on:
  workflow_call:

permissions:
  contents: read

env:
  CGO_ENABLED: "0"
  GOTOOLCHAIN: local

jobs:
  runtime-node-matrix:
    name: runtime (${{ matrix.os-label }}, node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ["18", "20", "22", "24"]
        include:
          - os: ubuntu-latest
            os-label: ubuntu
            ext: ""
          - os: macos-latest
            os-label: macos
            ext: ""
          - os: windows-latest
            os-label: windows
            ext: .exe
    steps:
      - name: Prevent CRLF conversion (Windows git dirty false positive)
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Runtime E2E integration tests
        shell: bash
        run: >-
          go test ./tests/integration/... -count=1
          -run 'RuntimeE2E|NodeVersion|ScriptWinsOverFile|WorkingDir|CWD|Workspace.*Run|Lifecycle'
          -v -timeout 20m

      - name: Runtime certification report
        if: always()
        shell: bash
        env:
          MEW_COMMIT_SHA: ${{ github.sha }}
        run: >-
          go run ./cmd/m conformance run runtime --json
          > "${{ runner.temp }}/runtime-certification-${{ matrix.os-label }}-node-${{ matrix.node-version }}.json"

      - name: Upload runtime certification report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-certification-${{ matrix.os-label }}-node-${{ matrix.node-version }}
          path: ${{ runner.temp }}/runtime-certification-${{ matrix.os-label }}-node-${{ matrix.node-version }}.json
          if-no-files-found: error
          retention-days: 14

  runtime-certification-aggregate:
    name: runtime certification aggregate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: runtime-node-matrix
    if: always()
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/download-artifact@v8
        with:
          pattern: runtime-certification-*
          path: runtime-reports
          merge-multiple: true

      - name: Verify runtime certification reports
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          cd runtime-reports

          expected=(
            "runtime-certification-ubuntu-node-18"
            "runtime-certification-ubuntu-node-20"
            "runtime-certification-ubuntu-node-22"
            "runtime-certification-ubuntu-node-24"
            "runtime-certification-macos-node-18"
            "runtime-certification-macos-node-20"
            "runtime-certification-macos-node-22"
            "runtime-certification-macos-node-24"
            "runtime-certification-windows-node-18"
            "runtime-certification-windows-node-20"
            "runtime-certification-windows-node-22"
            "runtime-certification-windows-node-24"
          )

          declare -A found
          for f in *.json; do
            name="${f%.json}"
            found["$name"]=1
          done

          fail=0
          for name in "${expected[@]}"; do
            if [[ -z "${found[$name]:-}" ]]; then
              echo "MISSING: $name"
              fail=1
            fi
          done

          for f in *.json; do
            name="${f%.json}"
            recognized=0
            for exp in "${expected[@]}"; do
              if [[ "$name" == "$exp" ]]; then
                recognized=1
                break
              fi
            done
            if [[ $recognized -eq 0 ]]; then
              echo "UNEXPECTED REPORT: $name"
              fail=1
            fi
          done

          # Validate canonical Report schema (schemaVersion 2).
          for f in *.json; do
            # Required top-level fields.
            if ! jq -e '.schemaVersion == 2 and .matrix == "runtime" and .commitSHA and .passed != null and (.suites | type) == "array"' "$f" > /dev/null 2>&1; then
              echo "MALFORMED (schema): $f"
              fail=1
              continue
            fi

            # Exact-head: commit must match workflow SHA.
            report_commit="$(jq -r .commitSHA "$f")"
            if [[ "$report_commit" != "${{ github.sha }}" ]]; then
              echo "STALE COMMIT: $f (report=$report_commit, workflow=${{ github.sha }})"
              fail=1
            fi

            # Verdict: must pass.
            passed="$(jq -r .passed "$f")"
            if [[ "$passed" != "true" ]]; then
              echo "FAILED REPORT: $f (passed=$passed)"
              fail=1
            fi

            # Suites: non-empty, required suites must be passed or not-applicable.
            suite_count="$(jq '.suites | length' "$f")"
            if [[ "$suite_count" -eq 0 ]]; then
              echo "EMPTY SUITES: $f"
              fail=1
              continue
            fi

            # Every required suite must have status passed or not-applicable.
            if ! jq -e '[.suites[] | select(.required == true) | .status] | all(. == "passed" or . == "not-applicable")' "$f" > /dev/null 2>&1; then
              echo "REQUIRED SUITE FAILURE: $f"
              jq -r '.suites[] | select(.required == true) | "  \(.id): \(.status)"' "$f"
              fail=1
            fi

            # No required suite may have zero tests matched (fail-closed).
            if ! jq -e '[.suites[] | select(.required == true) | select(.testsMatched != null) | .testsMatched] | all(. > 0)' "$f" > /dev/null 2>&1; then
              echo "ZERO-MATCH REQUIRED SUITE: $f"
              fail=1
            fi
          done

          if [[ $fail -ne 0 ]]; then
            echo "Runtime certification validation FAILED"
            exit 1
          fi
          echo "Runtime certification: ${#expected[@]} reports verified"

      - name: Produce aggregate summary
        if: always()
        shell: bash
        run: |
          cd runtime-reports
          count=$(find . -name '*.json' | wc -l)
          verified=false
          # Only claim verified when the previous step succeeded.
          if [[ "${{ steps.verify.outcome }}" == "success" ]]; then
            verified=true
          fi
          echo "{\"schemaVersion\":2,\"matrix\":\"runtime\",\"totalReports\":$count,\"expected\":12,\"commit\":\"${{ github.sha }}\",\"verified\":$verified}" > ../runtime-certification-summary.json

      - name: Upload aggregate summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-certification-summary
          path: runtime-certification-summary.json
          if-no-files-found: error
          retention-days: 14
